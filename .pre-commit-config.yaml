repos:
  - repo: local
    hooks:
      - id: no-build-artifacts
        name: refuse compiled firmware and distribution artifacts
        language: fail
        entry: Build release artifacts from source; do not commit them.
        files: '(?i)\.(bin|elf|hex|whl|tar\.gz)$'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.19
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: []
        # The copied wire auditor is checked through its adjacent typed stub.
        exclude: ^src/tekmar_482/_native_records\.py$
        additional_dependencies:
          - serialx==1.8.1
